{% extends "base.html" %}
{% block title %}Login — ClassFind{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-copy">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Back to finding what matters.</h1>
    <p>Sign in to publish reports, manage your items, and see potential matches.</p>
  </div>
  <form class="auth-card" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></label>
    <button class="primary-btn full" type="submit">Sign in →</button>
    <p class="auth-foot">New to ClassFind? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}

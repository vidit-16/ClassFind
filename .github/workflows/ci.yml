name: ClassFind CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: pip install ruff && ruff check .

      - name: Run application tests
        run: python -m unittest discover -s tests -v

  # The same tests on PostgreSQL, which the live site uses: schema upgrades,
  # case-insensitive search and date handling can differ from SQLite.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: classfind
          POSTGRES_PASSWORD: classfind
          POSTGRES_DB: classfind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classfind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://classfind:classfind@localhost:5432/classfind_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application tests on PostgreSQL
        run: python -m unittest discover -s tests -v
